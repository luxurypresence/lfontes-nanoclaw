"""Generic filter for numeric (Float) fields with multiple operator types"""
input NumericFilter {
  """Exact match - finds listings where field equals this value"""
  eq: Float

  """
  Match any value in array - finds listings where field matches any provided value
  """
  in: [Float!]

  """Greater than or equal to (>=) - range operator"""
  gte: Float

  """Less than or equal to (<=) - range operator"""
  lte: Float

  """Greater than (>) - range operator"""
  gt: Float

  """Less than (<) - range operator"""
  lt: Float
}

"""Generic filter for integer (Int) fields with multiple operator types"""
input IntegerFilter {
  """Exact match - finds listings where field equals this value"""
