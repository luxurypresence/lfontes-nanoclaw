"""Input for simulating contact enrichment"""
input SimulateEnrichmentInput {
  """The ID of the contact to enrich"""
  contactId: String!

  """
  A preset persona that sets baseline values. Other fields can override specific aspects.
  """
  preset: EnrichmentPersonaPreset

  """
  Life events to include in the enrichment. Can specify multiple concurrent events.
  """
  lifeEvents: [LifeEventInput!]

  """Marital status of the contact"""
  maritalStatus: SimulatedMaritalStatus

  """Number of children. Use 0 for no children."""
  numberOfChildren: Int

  """
  Ages of children for specific scenarios (e.g., [17, 14] for two teenagers)
  """
  childrenAges: [Int!]

  """Contact's age"""
  age: Int

  """Gender of the contact"""
  gender: String

  """Employment status"""
  employmentStatus: SimulatedEmploymentStatus

  """Specific job title (e.g., "Senior Software Engineer")"""
  jobTitle: String

  """Industry of employment (e.g., "Technology", "Healthcare")"""
  companyIndustry: String

  """Estimated income range"""
  estimatedIncome: SimulatedIncomeRange

  """Estimated wealth/net worth range"""
  estimatedWealth: SimulatedWealthRange

  """Current home ownership status"""
  homeOwnershipStatus: SimulatedHomeOwnershipStatus

  """
  Direct override for buyer intent score (0-100). Overrides calculated score.
  """
  buyerIntent: Int

  """
  Direct override for seller intent score (0-100). Overrides calculated score.
  """
  sellerIntent: Int

  """City for the generated address"""
  city: String

  """State for the generated address"""
  state: String

  """
  Additional context or notes for Claude to incorporate (e.g., "recently inherited money from grandparent")
  """
  notes: String
}

"""Preset personas for simulated enrichment generation"""
enum EnrichmentPersonaPreset {
  """"""
  FIRST_TIME_BUYER

  """"""
  GROWING_FAMILY

  """"""
  EXECUTIVE_RELOCATING

  """"""
  EMPTY_NESTER

  """"""
  INVESTOR

  """"""
  RETIREE_DOWNSIZING

  """"""
  DIVORCED_STARTING_OVER

  """"""
  TECH_WORKER

  """"""
  STRUGGLING_BUYER

  """"""
  LUXURY_BUYER

  """"""
  MILITARY_RELOCATION

  """"""
  STABLE_NO_INTENT
}

