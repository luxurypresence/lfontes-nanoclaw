"""
Filter on a single custom attribute assignment.

Value-field contract by operator:
- HAS: no value field (just "does this attribute exist on the contact")
- EQ / NEQ (enum):   valueIds (one or more CustomAttributeValue IDs)
- EQ / NEQ (string): valueString
- EQ / NEQ (number): valueNumber
- EQ / NEQ (bool):   valueBool
- CONTAINS:          valueString (string attributes only; substring match)
- LT / LTE / GT / GTE: valueNumber (number attributes only)

Clients must provide exactly the value field matching the operator and the
referenced attribute's declared type; mismatches are rejected with a
BadRequest.
"""
input CustomAttributeFilter {
  """Attribute key, e.g. 'custom_source'"""
  attributeKey: String!

  """"""
  op: CustomAttributeFilterOp!

  """Enum multi-select value IDs (EQ / NEQ on enum attributes)"""
  valueIds: [ID!]

  """Non-empty string value (EQ / NEQ / CONTAINS on string attributes)"""
  valueString: String

  """Number value (EQ / NEQ / LT / LTE / GT / GTE on number attributes)"""
  valueNumber: Float

  """Boolean value (EQ / NEQ on bool attributes)"""
  valueBool: Boolean
}

"""Comparison operator for a custom attribute filter"""
enum CustomAttributeFilterOp {
  """"""
  HAS

  """"""
  EQ

  """"""
  NEQ

  """"""
  CONTAINS

  """"""
  LT

  """"""
  LTE

  """"""
  GT

  """"""
  GTE
}

