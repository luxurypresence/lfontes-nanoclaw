"""
Statistical metrics for a specific market data point, providing comprehensive analysis including minimum, maximum, average, median, and percentile distributions.
"""
type StatisticalInsight {
  """
  The minimum (lowest) value observed in the data set. For prices, this represents the lowest price in USD. This value equals the 0th percentile when percentiles are included.
  """
  minimum: Float

  """
  The maximum (highest) value observed in the data set. For prices, this represents the highest price in USD. This value equals the 100th percentile when percentiles are included.
  """
  maximum: Float

  """
  The arithmetic mean (average) of all values in the data set. For prices, this is in USD. For ratios, this is expressed as a decimal (e.g., 0.98 = 98%). For days, this is the average number of days.
  """
  average: Float

  """
  The median (50th percentile) value - the middle value when the data set is ordered. Half of the values are above and half are below this value. For prices, this is in USD. Generally more representative than average for skewed distributions.
  """
  median: Float

  """
  The total sum of all values in the data set. For prices, this represents the total value in USD of all properties. Useful for calculating market volume.
  """
  summation: Float

  """
  The total count of data points included in this statistical calculation. For activeListings, this is the number of properties currently for sale. For other metrics, this is the sample size used for calculations.
  """
  count: Int

  """
  Distribution of values across percentiles. Returns an object with percentile keys (e.g., "25", "50", "75") and their corresponding values. The 50th percentile equals the median. Useful for understanding data distribution and identifying outliers. Example: {"25": 250000, "50": 350000, "75": 500000} for price data.
  """
  percentiles: JSON
}

"""
Comprehensive real estate market insights for a geographic area, including active listing statistics, pricing trends, sale ratios, and time-on-market metrics.
"""
type MarketInsights {
  """
  Unique identifier for this market insights response. Always returns "market-insights-v2" for JSON:API compliance. This ID is required by the JSON:API specification but does not represent a persisted resource.
  """
  id: String!

  """
  Statistics about properties currently for sale (ACTIVE status only). Typically returns only the count field, representing the total number of active listings in the specified area. This metric helps gauge market inventory levels.
  """
  activeListings: StatisticalInsight

  """
  List price statistics for currently active properties (ACTIVE status only). Prices are in USD. Includes distribution metrics (min, max, average, median) to understand asking price trends in the market. Does not include properties under contract or pending.
  """
  listPrice: StatisticalInsight

  """
  Final sale price statistics for recently sold properties (SOLD status only). Prices are in USD. Calculated using properties sold within the specified date range (default: last 30 days). Helps understand actual transaction values versus asking prices.
  """
  closePrice: StatisticalInsight

  """
  Sale-to-list price ratio statistics showing the relationship between final sale price and last list price. Expressed as a decimal (e.g., 0.98 = 98% of list price, 1.02 = 102% of list price). Values above 1.0 indicate properties selling above asking price. Calculated for properties sold within the specified date range.
  """
  saleToListRatio: StatisticalInsight

  """
  Days on market statistics measuring the time from initial listing to closing date. Expressed in days. Calculated for properties sold within the last year. Lower values indicate a faster-moving market. Includes average, median, minimum, and maximum days to provide a complete picture of market velocity.
  """
  daysOnMarket: StatisticalInsight
}

