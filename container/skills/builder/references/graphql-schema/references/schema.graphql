"""Input for simulating an email thread"""
input SimulateEmailThreadInput {
  """The ID of the contact to simulate the email thread for"""
  contactId: String!

  """
  The tenant user ID of the agent for the email thread. If not provided, a random agent from the company will be used.
  """
  tenantUserId: String

  """
  A preset that sets all parameters. Other fields can override specific aspects if needed.
  """
  preset: EmailThreadPreset

  """
  The topic/subject of the email thread. If not provided, will be randomized or taken from preset.
  """
  topic: EmailTopicPreset

  """
  When the thread started. If not provided, will be randomized or taken from preset.
  """
  timeframe: EmailTimeframe

  """
  Target number of emails in the thread (1-10). Actual count may vary based on responsiveness.
  """
  emailCount: Int

  """
  Contact responsiveness score (0-100). 0 = never responds, 100 = always responds promptly.
  """
  responsiveness: Int

  """
  Optional persona ID to generate emails matching a specific agent communication style. Uses persona voiceTone and communicationStyle from personas.config.ts.
  """
  personaId: String
}

