"""Result of a completed slide render workflow"""
type RenderSlideResult {
  """Reference ID matching the input slide ref"""
  slideRef: String!

  """Slide position in the carousel"""
  position: Int!

  """Role of the rendered slide"""
  role: SlideRole!

  """Template ID used for rendering"""
  templateId: TemplateId!

  """Permanent CMS URL of the rendered slide image"""
  mediaUrl: String!

  """Optional variant URLs as JSON"""
  variants: JSONObject
}

"""Payload returned after starting a render slide workflow"""
type RenderSlideStartPayload {
  """Temporal workflow ID for polling"""
  workflowId: ID!

  """Initial workflow status (always RUNNING)"""
  status: RenderSlideWorkflowStatus!
}

"""Status of a render slide Temporal workflow execution"""
enum RenderSlideWorkflowStatus {
  """"""
  RUNNING

  """"""
  COMPLETED

  """"""
  FAILED
}

"""Status payload for a render slide workflow execution"""
type RenderSlideStatusPayload {
  """Current workflow execution status"""
  status: RenderSlideWorkflowStatus!

  """Render result (present only when status is COMPLETED)"""
  result: RenderSlideResult

  """Error message (present only when status is FAILED)"""
  error: String
}

"""Configuration for a text slot within a slide"""
type TextSlotConfig {
  """Base font size in pixels"""
  fontSize: Int!

  """Minimum font size for auto-shrink"""
  minFontSize: Int

  """Maximum width constraint in pixels"""
  maxWidth: Int!

  """Maximum height constraint in pixels"""
  maxHeight: Int

  """Line height multiplier"""
  lineHeight: Float

  """Font weight"""
  fontWeight: Int

  """Letter spacing (e.g. "0.05em")"""
  letterSpacing: String

  """Top margin in pixels"""
  marginTop: Int

  """Maximum word count for this slot"""
  maxWords: Int

  """Maximum character count for this slot"""
  maxChars: Int
}

"""Canvas dimensions for slide rendering"""
type SlideCanvasConfig {
  """Canvas width in pixels"""
  width: Int!

  """Canvas height in pixels"""
  height: Int!
}

"""Background configuration for slide rendering"""
type SlideBackgroundConfig {
  """Background type (image, blurred-image, solid)"""
  type: String!

  """Background sizing mode"""
  sizing: String

  """When set, constrains background image to this height from top (px)"""
  imageHeight: Int

  """Blur configuration (amount, scale)"""
  blur: JSONObject

  """Solid color per color scheme { positive, reversed }"""
  solidColor: JSONObject
}

"""A single overlay layer for slide rendering"""
type SlideOverlayConfig {
  """Overlay type (color-tint, dim, gradient, border-frame)"""
  type: String!

  """Color source reference"""
  source: String

  """CSS blend mode"""
  blendMode: String

  """Opacity value (0-1)"""
  opacity: Float

  """Static color value"""
  color: String

  """CSS gradient string"""
  gradient: String

  """Border width for border-frame overlay (px)"""
  width: Int
}

"""Logo placement configuration"""
type SlideLogoConfig {
  """Target area in square pixels"""
  targetArea: Int!

  """Maximum width in pixels"""
  maxWidth: Int!

  """Maximum height in pixels"""
  maxHeight: Int!

  """Top offset in pixels"""
  top: Int

  """Bottom offset in pixels (positions logo from bottom)"""
  bottom: Int

  """
  Alignment per role as JSON { hook?: string, beat?: string, close?: string }
  """
  alignment: JSONObject
}

"""Content area bounds for slide rendering"""
type SlideContentAreaConfig {
  """Top bound in pixels"""
  top: Int!

  """Bottom bound in pixels"""
  bottom: Int!

  """Left bound in pixels"""
  left: Int!

  """Right bound in pixels"""
  right: Int!

  """Vertical alignment (center, top, bottom)"""
  verticalAlign: String!
}

"""Frame configuration for framed layout templates"""
type SlideFrameConfig {
  """Frame padding in pixels"""
  padding: Int!

  """Vertical padding (defaults to padding if omitted)"""
  paddingVertical: Int

  """Border radius in pixels"""
  borderRadius: Int

  """
  Background color per color scheme { positive: string, reversed: string }
  """
  backgroundColor: JSONObject!

  """Ratio of frame area allocated to the image"""
  imageAreaRatio: Float

  """When true, headline renders above image alongside logo"""
  headerRow: Boolean

  """Gap between header row, image, and footer text (px)"""
  gap: Int

  """Border width on the image (px)"""
  imageBorder: Int

  """Border color on the image per color scheme { positive, reversed }"""
  imageBorderColor: JSONObject

  """CSS box-shadow on the image"""
  imageShadow: String
}

"""
Full configuration for a slide template, defining layout, typography, and rendering rules
"""
type SlideTemplateConfig {
  """Unique template identifier"""
  id: TemplateId!

  """Display name of the template"""
  name: String!

  """Human-readable description of the template"""
  description: String!

  """Slide roles this template supports"""
  allowedRoles: [SlideRole!]!

  """Color scheme this config applies to"""
  colorScheme: ColorScheme!

  """Layout type for this template"""
  layout: LayoutType!

  """Canvas dimensions"""
  canvas: SlideCanvasConfig!

  """Background configuration"""
  background: SlideBackgroundConfig!

  """Ordered list of overlay layers"""
  overlays: [SlideOverlayConfig!]!

  """Logo placement configuration"""
  logo: SlideLogoConfig!

  """Content area bounds"""
  contentArea: SlideContentAreaConfig!

  """Frame configuration (only for framed layout templates)"""
  frame: SlideFrameConfig

  """
  Per-role text configuration as JSON { hook?: RoleConfig, beat?: RoleConfig, close?: RoleConfig }
  """
  roles: JSONObject!

  """
  Font families supported by the rendering pipeline. Only these fonts can be subset and embedded.
  """
  supportedFonts: [String!]!
}

"""
Color scheme variant for slide rendering (positive = light, reversed = dark)
"""
enum ColorScheme {
  """"""
  POSITIVE

  """"""
  REVERSED
}

"""Layout type for slide template rendering"""
enum LayoutType {
  """"""
  OVERLAY

  """"""
  FRAMED

  """"""
  SPLIT
}

