"""Input for starting a slide render workflow"""
input RenderSlideInput {
  """Company ID for authorization"""
  companyId: ID!

  """Slide content and positioning details"""
  slide: SlideInput!

  """Template to use for rendering"""
  templateId: TemplateId!

  """HTTPS URL of the listing image to render"""
  imageUrl: String!

  """Color scheme variant (positive or reversed)"""
  colorScheme: ColorScheme!

  """Accent color for this slide (#RRGGBB)"""
  accentColor: String!

  """Brand context for rendering (logos, typography, palette)"""
  brand: BrandContextInput!
}

"""Content and positioning for a single slide"""
input SlideInput {
  """Unique reference ID for this slide"""
  ref: String!

  """Zero-based position of this slide in the carousel"""
  position: Int!

  """Role of this slide (hook, beat, close)"""
  role: SlideRole!

  """Headline text for this slide"""
  headline: String

  """Subhead text for this slide"""
  subhead: String

  """Body text for this slide"""
  body: String
}

"""Brand context for slide rendering"""
input BrandContextInput {
  """Typography configuration"""
  typography: BrandTypographyInput!

  """URL to light variant of agent logo (HTTPS)"""
  lightLogoUrl: String

  """URL to dark variant of agent logo (HTTPS)"""
  darkLogoUrl: String

  """URL to light variant of brokerage logo (HTTPS)"""
  brokerageLightLogoUrl: String

  """URL to dark variant of brokerage logo (HTTPS)"""
  brokerageDarkLogoUrl: String

  """Primary brand accent color (#RRGGBB)"""
  accentColor: String!

  """Brand color palette entries"""
  palette: [PaletteEntryInput!]!
}

"""Typography settings for brand rendering"""
input BrandTypographyInput {
  """Font family for headlines"""
  headlineFont: String

  """Font family for body text"""
  bodyFont: String

  """Font weight for headlines"""
  headlineFontWeight: Int

  """Font weight for body text"""
  bodyFontWeight: Int

  """
  Text transform for headlines (none or uppercase). Affects typography sizing.
  """
  headlineTextTransform: String
}

"""A single color entry in a brand palette"""
input PaletteEntryInput {
  """Hex color value (#RRGGBB)"""
  hex: String!

  """Optional display name for the color"""
  name: String
}

"""
A code-level integration adapter (e.g. Rollout, direct API). Maps a vendor to its TypeScript adapter class.
"""
type IntegrationProviderType {
  """Provider primary key (UUID)."""
  id: ID!

  """Stable provider identifier used by lookup APIs (e.g. "rollout")."""
  name: String!

  """Human-readable provider name for admin UIs."""
  displayName: String!

  """
  Fully qualified TypeScript class implementing the IntegrationProvider interface for this provider.
  """
  adapterClass: String!

  """Whether this provider is enabled for new vendor configurations."""
  isActive: Boolean!
}

"""
A specific external CRM (e.g. Follow Up Boss, BoomTown) reachable through a provider adapter.
"""
type IntegrationVendorType {
  """Vendor primary key (UUID)."""
  id: ID!

  """Stable vendor identifier used by lookup APIs (e.g. "followupboss")."""
  name: String!

  """Human-readable vendor name for admin UIs."""
  displayName: String!

  """Foreign key to the IntegrationProviderType that handles this vendor."""
  providerId: ID!

  """Resolved provider for this vendor, if loaded."""
  provider: IntegrationProviderType

  """
  Rollout app key for this vendor when the provider is Rollout-backed; null for direct-API vendors.
  """
  appKey: String

  """
  Maximum sync direction this vendor supports (caps the per-config syncDirection).
  """
  supportedSyncDirection: SyncDirection!

  """Whether this vendor is enabled for new company configurations."""
  isActive: Boolean!
}

"""
High-level sync mode for an integration: data flows in from the vendor, out to the vendor, or both ways.
"""
enum SyncDirection {
  """"""
  INBOUND

  """"""
  OUTBOUND

  """"""
  BIDIRECTIONAL
}

"""
A versioned field-mapping schema that drives transforms between LP records and a provider payload.
"""
type IntegrationMappingSchemaType {
  """Schema primary key (UUID)."""
  id: ID!

  """Provider this schema applies to."""
  providerId: ID!

  """Record category this schema covers (e.g. "person")."""
